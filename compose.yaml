services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: edumanager
      POSTGRES_USER: edumanager
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edumanager -d edumanager"]
      interval: 5s
      timeout: 3s
      retries: 20
  web:
    build:
      context: .
      target: runtime
    env_file: .env
    environment:
      DATABASE_URL: postgresql://edumanager:${POSTGRES_PASSWORD}@db:5432/edumanager
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
  tools:
    profiles: [tools]
    build:
      context: .
      target: tools
    env_file: .env
    environment:
      DATABASE_URL: postgresql://edumanager:${POSTGRES_PASSWORD}@db:5432/edumanager
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres-data:
